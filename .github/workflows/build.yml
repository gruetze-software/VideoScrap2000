name: Build and platform packages
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      windows_linux_x64_only:
        description: Build only Windows x64 and Linux x64 test packages
        type: boolean
        default: false
      create_release_draft:
        description: Create or update the unpublished release draft after packaging
        type: boolean
        default: false
      replace_published_release:
        description: Replace the published release and recreate its version tag (manual repair only)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows_linux_x64_only && '["windows-latest","ubuntu-latest"]' || '["windows-latest","ubuntu-latest","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install native media dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libmms0
      - run: dotnet test VideoScrap2000.Tests/VideoScrap2000.Tests.csproj -c Release -m:1
      - name: Diagnose native Linux dependencies
        if: failure() && runner.os == 'Linux'
        run: find VideoScrap2000.Tests/bin -name 'libmediainfo.so' -exec ldd {} \;

  linux-display:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install native display test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y weston wayland-utils xvfb xauth libmms0 libwayland-client0 libwayland-cursor0 libwayland-egl1 libegl1 libgles2 libgbm1 libgl1-mesa-dri
      - name: Exercise native Wayland and X11 fallback with real windows
        run: bash scripts/test-linux-backends.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: VideoScrap2000-linux-display-logs
          path: artifacts/linux-backends/*
          if-no-files-found: warn

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [verify, linux-display]
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON(inputs.windows_linux_x64_only &&
          '[{"os":"windows-latest","rids":"win-x64","name":"windows"},{"os":"ubuntu-latest","rids":"linux-x64","name":"linux-x64"}]' ||
          '[{"os":"windows-latest","rids":"win-x64,win-arm64","name":"windows"},{"os":"ubuntu-latest","rids":"linux-x64","name":"linux-x64"},{"os":"ubuntu-24.04-arm","rids":"linux-arm64","name":"linux-arm64"}]') }}
    name: Package ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install native media dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libmms0
      - shell: pwsh
        run: |
          if ($env:FANART_TV_PROJECT_API_KEY -notmatch '^[0-9a-fA-F]{32}$') {
            throw 'Set the FANART_TV_PROJECT_API_KEY repository secret before creating release packages.'
          }
          if ($env:TVDB_PROJECT_API_KEY -notmatch '^[0-9a-fA-F-]{36}$') { throw 'Missing TheTVDB project key.' }
          foreach ($runtime in '${{ matrix.platform.rids }}'.Split(',')) {
            ./scripts/Publish.ps1 -Runtime $runtime
            ./scripts/Publish.ps1 -Runtime $runtime -FrameworkDependent
          }
        env:
          FANART_TV_PROJECT_API_KEY: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.FANART_TV_PROJECT_API_KEY || '' }}
          TVDB_PROJECT_API_KEY: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.TVDB_PROJECT_API_KEY || '' }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: VideoScrap2000-${{ matrix.platform.name }}
          path: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.manifest.json
            artifacts/**/*.sha256
          if-no-files-found: error

  macos:
    if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && !inputs.windows_linux_x64_only
    needs: [verify, linux-display]
    uses: ./.github/workflows/macos.yml
    secrets: inherit

  deb:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [verify, linux-display]
    uses: ./.github/workflows/linux-deb.yml
    with:
      only_x64: ${{ inputs.windows_linux_x64_only || false }}
    secrets: inherit

  release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (inputs.create_release_draft || inputs.replace_published_release))
    needs: [package, deb, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: VideoScrap2000-*
          path: packages
      - name: Create GitHub release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPLACE_PUBLISHED_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_published_release }}
        run: |
          [xml]$project = Get-Content MovieScrap2000/MovieScrap2000.csproj -Raw
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $releaseTag = "v$version"
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_REF -ne "refs/tags/$releaseTag") {
            throw 'The version tag must match the application version.'
          }
          $archives = @(Get-ChildItem packages -File -Recurse | Where-Object Name -Match '^VideoScrap2000-.*\.(zip|tar\.gz)$')
          if ($archives.Count -ne 12) { throw "Expected twelve platform archives, found $($archives.Count)." }
          $installers = @(Get-ChildItem packages -Filter '*.deb' -File -Recurse)
          if ($installers.Count -ne 2) { throw 'Expected AMD64 and ARM64 DEB installers.' }
          $diskImages = @(Get-ChildItem packages -Filter '*.dmg' -File -Recurse)
          if ($diskImages.Count -ne 2) { throw 'Expected signed Intel and Apple Silicon DMG installers.' }
          $dmgManifests = @(Get-ChildItem packages -Filter '*.dmg-info.json' -File -Recurse)
          if ($dmgManifests.Count -ne 2) { throw 'Expected two signed DMG manifests.' }
          $macManifests = @(Get-ChildItem packages -Filter '*.manifest.json' -File -Recurse |
            ForEach-Object { Get-Content $_.FullName -Raw | ConvertFrom-Json } | Where-Object runtime -Like 'osx-*')
          if ($macManifests.Count -ne 4 -or @($macManifests | Where-Object { !$_.signed -or !$_.notarized }).Count -gt 0) {
            throw 'All official macOS archives must be signed and notarized.'
          }
          foreach ($infoFile in $dmgManifests) {
            $info = Get-Content $infoFile.FullName -Raw | ConvertFrom-Json
            if (!$info.signed -or !$info.notarized) { throw 'Official macOS installers must be signed and notarized.' }
          }
          $releaseNotes = 'release-notes.md'
          ./scripts/New-ReleaseSummary.ps1 -PackageRoot packages -Version $version -Repository $env:GH_REPO -NotesPath $releaseNotes -ChecksumPath SHA256SUMS.txt
          $assets = @($archives.FullName) + @($installers.FullName) + @($diskImages.FullName) + @((Get-Item SHA256SUMS.txt).FullName)
          $existing = gh release view $releaseTag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) {
              if ($env:REPLACE_PUBLISHED_RELEASE -ne 'true') {
                Write-Host 'This release is already public. Keeping the published files unchanged; use the explicit replacement option to rebuild a published release.'
                exit 0
              }
              $release = gh api "repos/$env:GH_REPO/releases/tags/$releaseTag" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0 -or $release.immutable) { throw 'The release cannot be replaced.' }
              gh release upload $releaseTag @assets --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Replacement upload failed; rerun this repair before updating the tag.' }
              foreach ($oldAsset in $release.assets | Where-Object name -Match '^VideoScrap2000-.*-osx-.*\.tar\.gz$') {
                gh api --method DELETE "repos/$env:GH_REPO/releases/assets/$($oldAsset.id)"
                if ($LASTEXITCODE -ne 0) { throw 'Could not remove an obsolete macOS archive.' }
              }
              # Separate Snap/Flatpak workflows may have supplied unchanged store
              # bundles. Keep their checksums when repairing an existing release.
              $uploaded = gh api "repos/$env:GH_REPO/releases/$($release.id)" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Cannot verify uploaded release assets.' }
              $checksumLines = foreach ($asset in $uploaded.assets | Where-Object name -ne 'SHA256SUMS.txt' | Sort-Object name) {
                if ($asset.digest -notmatch '^sha256:([a-f0-9]{64})$') { throw "Missing asset digest: $($asset.name)" }
                "$($Matches[1])  $($asset.name)"
              }
              [IO.File]::WriteAllText((Join-Path $PWD 'SHA256SUMS.txt'), ($checksumLines -join "`n") + "`n")
              gh release upload $releaseTag SHA256SUMS.txt --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Cannot update the complete checksum file.' }
              foreach ($storeAsset in $uploaded.assets | Where-Object name -Match '\.(snap|flatpak)$') {
                [IO.File]::AppendAllText((Join-Path $PWD $releaseNotes), "`nLinux alternative: [$($storeAsset.name)]($($storeAsset.browser_download_url)).`n")
              }
              $oldRef = gh api "repos/$env:GH_REPO/git/ref/tags/$releaseTag" | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Cannot read the existing tag.' }
              $newTag = gh api --method POST "repos/$env:GH_REPO/git/tags" -f "tag=$releaseTag" -f "message=VideoScrap 2000 $releaseTag (replaced release)" -f "object=$env:RELEASE_COMMIT" -f type=commit | ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare replacement tag.' }
              gh api --method DELETE "repos/$env:GH_REPO/git/refs/tags/$releaseTag"
              if ($LASTEXITCODE -ne 0) { throw 'Cannot remove the existing tag.' }
              gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$releaseTag" -f "sha=$($newTag.sha)"
              if ($LASTEXITCODE -ne 0) {
                gh api --method POST "repos/$env:GH_REPO/git/refs" -f "ref=refs/tags/$releaseTag" -f "sha=$($oldRef.object.sha)"
                throw 'Tag recreation failed; attempted to restore the original tag.'
              }
              # Deleting the tag automatically returns its release to draft status.
              gh release edit $releaseTag --draft=false --latest --notes-file $releaseNotes --title "VideoScrap 2000 $releaseTag"
              if ($LASTEXITCODE -ne 0) { throw 'Release notes update failed.' }
              exit 0
            }
            gh release upload $releaseTag @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $releaseTag --draft --target $env:RELEASE_COMMIT --notes-file $releaseNotes --title "VideoScrap 2000 $releaseTag"
          } else {
            gh release create $releaseTag --target $env:RELEASE_COMMIT --draft --notes-file $releaseNotes --title "VideoScrap 2000 $releaseTag" @assets
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
