name: Generate Flatpak NuGet sources with official tool
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check upstream installer syntax and metadata
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak desktop-file-utils appstream
          bash -n scripts/install-flatpak.sh
          bash scripts/install-flatpak.sh --help
          desktop-file-validate branding/linux/de.gruetze_software.VideoScrap2000.desktop
          appstreamcli validate --no-net branding/linux/de.gruetze_software.VideoScrap2000.metainfo.xml
      - name: Install matching SDK and .NET extension
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.freedesktop.Sdk//26.08 org.freedesktop.Sdk.Extension.dotnet10//26.08
      - name: Generate unchanged source inputs with Flatpak's official generator
        run: |
          set -euo pipefail
          mkdir -p artifacts/flatpak-tools
          revision=9d86d336a39b9af38b86f114b6ce5820fe260f91
          printf '%s\n' "$revision" > artifacts/flatpak-tools/generator-commit.txt
          curl --fail --location "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/$revision/dotnet/flatpak-dotnet-generator.py" -o artifacts/flatpak-tools/flatpak-dotnet-generator.py
          for rid in linux-x64 linux-arm64; do
            python3 artifacts/flatpak-tools/flatpak-dotnet-generator.py "artifacts/flatpak-tools/$rid.json" MovieScrap2000/MovieScrap2000.csproj --dotnet 10 --freedesktop 26.08 --runtime "$rid" --dotnet-args -p:NuGetAudit=false -p:Configuration=Release
          done
          python3 - <<'PY'
          import json, pathlib
          merged = {}
          for rid in ('linux-x64', 'linux-arm64'):
              entries = json.loads(pathlib.Path(f'artifacts/flatpak-tools/{rid}.json').read_text())
              assert entries, rid
              for source in entries:
                  name = source['dest-filename']
                  assert name not in merged or merged[name] == source, name
                  merged[name] = source
          sources = [merged[name] for name in sorted(merged)]
          pathlib.Path('packaging/flatpak/nuget-sources.json').write_text(json.dumps(sources, indent=4)+'\n')
          assert sources and all(source['sha512'] and source['url'].startswith('https://api.nuget.org/') for source in sources)
          assert any(source['dest-filename'].startswith('avalonia.x11.') for source in sources)
          assert any(source['dest-filename'].startswith('microsoft.data.sqlite.') for source in sources)
          # AppHost/reference packs already provided by the matching SDK do not
          # need separate downloads. An actual offline publish below checks this.
          print(f'Generated {len(sources)} NuGet sources for both Linux architectures.')
          PY
      - name: Verify installer with the matching SDK and no network access
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, pathlib, urllib.request
          feed = pathlib.Path('artifacts/flatpak-feed')
          feed.mkdir(parents=True, exist_ok=True)
          sources = json.loads(pathlib.Path('packaging/flatpak/nuget-sources.json').read_text())
          def fetch(source):
              data = urllib.request.urlopen(source['url'], timeout=120).read()
              assert hashlib.sha512(data).hexdigest() == source['sha512'], source['url']
              name = source['dest-filename']
              assert pathlib.Path(name).name == name
              (feed / name).write_bytes(data)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(fetch, sources))
          PY
          flatpak run --unshare=network --filesystem=host --env=DOTNET_ROOT=/usr/lib/sdk/dotnet10/lib --command=bash --runtime=org.freedesktop.Sdk//26.08 org.freedesktop.Sdk.Extension.dotnet10//26.08 -c '
            set -euo pipefail
            export PATH="/usr/lib/sdk/dotnet10/bin:$PATH"
            export LD_LIBRARY_PATH="/usr/lib/sdk/dotnet10/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            bash scripts/install-flatpak.sh --prefix "$PWD/artifacts/flatpak-stage" --nuget-source "$PWD/artifacts/flatpak-feed"
            test -x artifacts/flatpak-stage/bin/videoscrap2000
            test -f artifacts/flatpak-stage/share/metainfo/de.gruetze_software.VideoScrap2000.metainfo.xml
            export LD_LIBRARY_PATH="$PWD/artifacts/flatpak-stage/lib/videoscrap2000:$PWD/artifacts/flatpak-stage/lib:$LD_LIBRARY_PATH"
            ldd artifacts/flatpak-stage/lib/videoscrap2000/libmediainfo.so | tee artifacts/flatpak-native-dependencies.txt
          '
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: VideoScrap2000-Flatpak-NuGet-sources
          path: |
            packaging/flatpak/nuget-sources.json
            artifacts/flatpak-tools/generator-commit.txt
            artifacts/flatpak-native-dependencies.txt
          if-no-files-found: error
