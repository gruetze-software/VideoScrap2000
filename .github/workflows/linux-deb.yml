name: Linux Mint DEB test package
on:
  workflow_dispatch:
    inputs:
      only_x64:
        description: Build only the AMD64 package
        type: boolean
        default: false
  workflow_call:
    inputs:
      only_x64:
        type: boolean
        default: false
    secrets:
      FANART_TV_PROJECT_API_KEY:
        required: true
      TVDB_PROJECT_API_KEY:
        required: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ fromJSON(inputs.only_x64 &&
          '[{"os":"ubuntu-22.04","rid":"linux-x64","arch":"amd64"}]' ||
          '[{"os":"ubuntu-22.04","rid":"linux-x64","arch":"amd64"},{"os":"ubuntu-24.04-arm","rid":"linux-arm64","arch":"arm64"}]') }}
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install packaging dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y libmms0 desktop-file-utils
      - name: Publish with bundled .NET 10
        shell: pwsh
        env:
          FANART_TV_PROJECT_API_KEY: ${{ secrets.FANART_TV_PROJECT_API_KEY }}
          TVDB_PROJECT_API_KEY: ${{ secrets.TVDB_PROJECT_API_KEY }}
        run: |
          if ($env:FANART_TV_PROJECT_API_KEY -notmatch '^[0-9a-fA-F]{32}$') { throw 'Missing Fanart.tv project key.' }
          if ($env:TVDB_PROJECT_API_KEY -notmatch '^[0-9a-fA-F-]{36}$') { throw 'Missing TheTVDB project key.' }
          ./scripts/Publish.ps1 -Runtime '${{ matrix.platform.rid }}'
          $manifestFile = Get-ChildItem 'artifacts/${{ matrix.platform.rid }}' -Recurse -Filter '*.manifest.json' | Select-Object -First 1
          $manifest = Get-Content $manifestFile.FullName -Raw | ConvertFrom-Json
          $publish = Join-Path $manifestFile.DirectoryName 'VideoScrap2000'
          bash scripts/Package-Deb.sh $publish $manifest.version artifacts/deb
          if ($LASTEXITCODE -ne 0) { throw 'DEB packaging failed.' }
      - name: Verify installation and startup without installed .NET
        shell: bash
        run: |
          set -euo pipefail
          for base in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm -v "$PWD/artifacts/deb:/packages:ro" "$base" bash -c '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends /packages/*.deb xvfb xauth
              ! command -v dotnet
              test -x /usr/bin/videoscrap2000
              test -f /usr/share/applications/de.gruetze_software.VideoScrap2000.desktop
              test -f /usr/share/icons/hicolor/256x256/apps/de.gruetze_software.VideoScrap2000.png
              export LD_LIBRARY_PATH="/opt/videoscrap2000${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
              for library in /opt/videoscrap2000/*.so*; do
                # Optional .NET event tracing is not used by the app and can require
                # an older LTTng ABI. Normal startup must work without that plugin.
                case "$library" in */libcoreclrtraceptprovider.so) continue ;; esac
                if ldd "$library" | grep "not found"; then echo "Missing dependency: $library"; exit 1; fi
              done
              xvfb-run -a /usr/bin/videoscrap2000 --startup-check
              apt-get remove -y videoscrap2000
              test ! -e /usr/bin/videoscrap2000
              test ! -e /usr/share/applications/de.gruetze_software.VideoScrap2000.desktop
            '
          done
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: VideoScrap2000-Linux-Mint-DEB-${{ matrix.platform.arch }}
          path: artifacts/deb/*
          if-no-files-found: error
